; GPU-тест: максимальная нагрузка на видеокарту.
;
; ЧЕРНОВИК. Ключи ниже — стандартные для игр на Unreal Engine. Для Benchmark Tool они
; ещё не проверены: настоящие имена ключей нужно снять с файла настроек самой утилиты.
;
; Разрешение не задаём: тест идёт в том, которое уже выбрано в утилите (обычно родное для монитора).
; Трассировку лучей и апскейлинг добавим, когда узнаем их ключи.

[/Script/Engine.GameUserSettings]
; Без ограничений частоты кадров.
bUseVSync=False
FrameRateLimit=0.000000

[ScalabilityGroups]
; Масштаб рендера 100%: картинка считается в полном разрешении, без апскейла.
sg.ResolutionQuality=100
; Все настройки качества на максимум.
sg.ViewDistanceQuality=4
sg.AntiAliasingQuality=4
sg.ShadowQuality=4
sg.GlobalIlluminationQuality=4
sg.ReflectionQuality=4
sg.PostProcessQuality=4
sg.TextureQuality=4
sg.EffectsQuality=4
sg.FoliageQuality=4
sg.ShadingQuality=4
