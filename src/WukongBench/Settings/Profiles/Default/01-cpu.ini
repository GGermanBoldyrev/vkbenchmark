; CPU-тест: снять нагрузку с видеокарты, чтобы FPS упирался в процессор.
;
; ЧЕРНОВИК. Ключи ниже — стандартные для игр на Unreal Engine. Для Benchmark Tool они
; ещё не проверены: настоящие имена ключей нужно снять с файла настроек самой утилиты.

[/Script/Engine.GameUserSettings]
; Минимальное разрешение: видеокарте почти нечего рисовать.
ResolutionSizeX=1280
ResolutionSizeY=720
LastUserConfirmedResolutionSizeX=1280
LastUserConfirmedResolutionSizeY=720
; Без ограничений частоты кадров, иначе результат упрётся в лимит, а не в процессор.
bUseVSync=False
FrameRateLimit=0.000000

[ScalabilityGroups]
; Масштаб рендера на минимум: ещё меньше работы для видеокарты.
sg.ResolutionQuality=50
; Чисто графические настройки на минимум.
sg.AntiAliasingQuality=0
sg.PostProcessQuality=0
sg.TextureQuality=0
sg.EffectsQuality=0
sg.GlobalIlluminationQuality=0
sg.ReflectionQuality=0
sg.ShadingQuality=0
; Настройки, которые нагружают в основном процессор, оставляем высокими.
sg.ViewDistanceQuality=3
sg.ShadowQuality=3
sg.FoliageQuality=3
